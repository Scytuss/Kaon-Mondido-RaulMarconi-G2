
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f2;
            color: #26352b;
        }

        nav {
            background: #285943;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #285943;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button, .btn {
            background: #285943;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover, .btn:hover {
            background: #39795a;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #e7f4e8;
        }

        .errorlist {
            color: #c0392b;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">Kaon</div>

        <div>

            {% if user.is_authenticated %}

                <a href="{% url 'dashboard' %}">Dashboard</a>

                <a href="{% url 'profile' %}">Profile</a>

                <form method="POST"
                      action="{% url 'logout' %}"
                      style="display:inline;">

                    {% csrf_token %}

                    <button type="submit">Logout</button>

                </form>

            {% else %}

                <a href="{% url 'login' %}">Login</a>

                <a href="{% url 'register' %}">Register</a>

            {% endif %}

        </div>

    </nav>


    <div class="container">

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        {% block content %}

        {% endblock %}

    </div>


    <footer>
        <p>Kaon – Track Your Filipino Food!</p>
    </footer>

</body>
</html>
