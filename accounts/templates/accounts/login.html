
{% extends 'accounts/base.html' %}

{% block content %}

<h1>Welcome Back!</h1>

<p>Login to your Kaon account.</p>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>

</form>

<p>
    Don't have an account?
    <a href="{% url 'register' %}">Register here</a>
</p>

{% endblock %}
