
{% extends 'accounts/base.html' %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-heading">
            <span class="auth-icon">🍃</span>
            <p class="welcome-label">WELCOME TO KAON</p>
            <h1>KAON: Track Your Filipino Food</h1>
            <p>Login to your account and start your nutrition journey.</p>
        </div>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn auth-submit">
                Login to Kaon
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Don't have an account?
                <a href="{% url 'register' %}">Create one here</a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
